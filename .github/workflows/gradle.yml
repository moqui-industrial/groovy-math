name: Gradle

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Only this job needs the upstream schema, and only to prove the vendored copies
      # under src/main/resources have not drifted from it. Nothing here reads them to run.
      - uses: actions/checkout@v4
        with:
          repository: moqui/moqui-math
          path: moqui-math
      - uses: actions/checkout@v4
        with:
          repository: moqui/moqui-framework
          path: moqui-framework
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check vendored schema against upstream
        env:
          MOQUI_MATH_HOME: ${{ github.workspace }}/moqui-math
          MOQUI_FRAMEWORK_HOME: ${{ github.workspace }}/moqui-framework
      - name: Verify no preview flags
        run: |
          if grep -rn "enable-preview" build.gradle; then
            echo "ERROR: Found forbidden --enable-preview in build.gradle"
            exit 1
          fi
      - name: Test
        run: ./gradlew check
      - name: Run OR-Tools example
        run: ./gradlew runOrToolsProductionPlan

  petsc-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install PETSc development files
        run: sudo apt-get update && sudo apt-get install --yes petsc-dev ninja-build pkg-config
      - name: Build bridge and run native TAO tests
        run: ./gradlew petscTaoNativeTest
      - name: Run PETSc/TAO energy dispatch example
        run: ./gradlew runPetscTaoEnergyDispatch

  jax-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python embedding headers and JAX
        run: |
          sudo apt-get update && sudo apt-get install --yes python3-dev ninja-build
          pip install numpy jax
      - name: Build bridge and run native JAX tests
        run: ./gradlew jaxNativeTest

  opencv-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python embedding headers and OpenCV
        run: |
          sudo apt-get update && sudo apt-get install --yes python3-dev ninja-build
          pip install numpy opencv-python-headless
      - name: Build bridge and run native OpenCV tests
        run: ./gradlew openCvNativeTest
