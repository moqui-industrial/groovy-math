plugins {
    id 'groovy'
    id 'java-library'
    id 'jacoco'
    id 'maven-publish'
}

// groovy-math targets Java 25 LTS with standard Foreign Function & Memory (FFM) API.
// Gradle Java Toolchain (configured below) strictly enforces Java 25.

repositories {
    mavenCentral()
}

dependencies {
    api 'org.apache.groovy:groovy:5.0.8'
    implementation 'org.apache.groovy:groovy-json:5.0.8'
    implementation 'com.google.ortools:ortools-java:9.15.6755'
    implementation 'org.apache.jena:jena-arq:5.3.0'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Java 25 LTS with standard Foreign Function & Memory (FFM) API (JEP 454).
