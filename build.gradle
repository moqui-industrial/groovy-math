def osPrefix = org.gradle.internal.os.OperatingSystem.current().with {
    isWindows() ? 'windows' : isMacOsX() ? 'osx' : 'linux'
}
def archPrefix = System.getProperty('os.arch', '').toLowerCase().with {
    (it.contains('x86_64') || it.contains('amd64')) ? 'x86_64' : (it.contains('aarch64') || it.contains('arm64')) ? 'aarch64' : it
}

tasks.register('packageNativeLibs', Copy) {
    into layout.buildDirectory.dir("resources/main/native/${osPrefix}-${archPrefix}")
    from(nativeBuildDirectory) { include '*.so', '*.dylib', '*.dll' }
    from(jaxBuildDirectory) { include '*.so', '*.dylib', '*.dll' }
    from(openCvBuildDirectory) { include '*.so', '*.dylib', '*.dll' }
    from(petscTaoBuildDirectory) { include '*.so', '*.dylib', '*.dll' }
    from(openFoamBuildDirectory) { include '*.so', '*.dylib', '*.dll' }
    from(onnxBuildDirectory) { include '*.so', '*.dylib', '*.dll' }
}
tasks.named('jar').configure {
    dependsOn 'packageNativeLibs'
    manifest {
        attributes('Enable-Native-Access': 'ALL-UNNAMED')
    }
}

def pythonVenvDir = file("${projectDir}/runtime/python_venv")

tasks.register('setupPythonVenv', Exec) {
    group = 'Python'
    description = 'Sets up an isolated Python virtual environment for JAX runtime'
    outputs.dir(pythonVenvDir)
    commandLine 'python3', '-m', 'venv', pythonVenvDir.absolutePath
}

tasks.register('installPythonRequirements', Exec) {
    group = 'Python'
    description = 'Installs requirements in the isolated Python virtual environment'
    dependsOn tasks.named('setupPythonVenv')
    def isWin = org.gradle.internal.os.OperatingSystem.current().isWindows()
    def pipExe = isWin ? new File(pythonVenvDir, "Scripts/pip.exe") : new File(pythonVenvDir, "bin/pip")
    commandLine pipExe.absolutePath, 'install', '-r', file('requirements.txt').absolutePath
}

// Generates the model/ and metamodel/ classes from the *vendored* schema, so the POJOs
// always match the XML that ships in the jar. Refresh the schema first with syncMoquiSchema.
tasks.register('generateModels', Exec) {
    group = 'Moqui schema'
    description = 'Regenerates model and metamodel classes from the vendored Moqui schema.'
    commandLine 'python3', file('scripts/generate_models.py').absolutePath
}

// The canonical Moqui schema is vendored under src/main/resources/moqui-math so that
// a plain clone of this repository builds, tests and runs its examples with no Moqui
// checkout and no MOQUI_MATH_ENTITIES environment variable. Upstream stays the editing
// source of truth; these two tasks keep the vendored copies honest.
tasks.register('syncMoquiSchema', Exec) {
    group = 'Moqui schema'
    description = 'Refreshes the vendored Moqui schema from an upstream checkout.'
    commandLine 'python3', file('scripts/sync_schema.py').absolutePath
}

tasks.register('pushMoquiSchema', Exec) {
    group = 'Moqui schema'
    description = 'Copies the vendored Moqui schema back into the upstream checkouts.'
    commandLine 'python3', file('scripts/sync_schema.py').absolutePath, '--push'
}

tasks.register('generateVocabularySnapshot', JavaExec) {
    group = 'Documentation'
    description = 'Generates docs/dsl/vocabulary.md from embedded Moqui schema'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'org.moqui.math.dsl.DslVocabulary'
}

