    mainClass = 'groovy.math.libtorch.LibTorchParallelBenchmark'
    systemProperty 'groovy.math.libtorch.library',
        nativeBuildDirectory.get().file('libgroovy_math_libtorch.so').asFile.absolutePath
    if (System.getProperty('groovy.math.benchmark.iterations')) {
        systemProperty 'groovy.math.benchmark.iterations', System.getProperty('groovy.math.benchmark.iterations')
    }
}

tasks.register('benchmarkLibTorchCompute', JavaExec) {
    dependsOn tasks.named('buildLibTorchNative'), tasks.named('testClasses')
