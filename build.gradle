    systemProperty 'groovy.math.libtorch.library',
        nativeBuildDirectory.get().file('libgroovy_math_libtorch.so').asFile.absolutePath
    ['width', 'batch', 'iterations'].each { String option ->
        String value = System.getProperty("groovy.math.benchmark.${option}")
