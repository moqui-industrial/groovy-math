plugins {
    id 'groovy'
    id 'java-library'
    id 'jacoco'
    id 'maven-publish'
}

repositories {
    mavenCentral()
}

dependencies {
    api 'org.apache.groovy:groovy:5.0.8'
    implementation 'org.apache.groovy:groovy-json:5.0.8'
    implementation 'com.google.ortools:ortools-java:9.15.6755'
    implementation 'org.apache.jena:jena-arq:5.3.0'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['--enable-preview']
}

tasks.withType(GroovyCompile).configureEach {
    groovyOptions.forkOptions.jvmArgs += ['--enable-preview']
}

tasks.withType(Test).configureEach {
    jvmArgs += ['--enable-preview']
}

tasks.withType(JavaExec).configureEach {
    jvmArgs += ['--enable-preview']
}

tasks.named('test') {
    useJUnitPlatform()
    useJUnitPlatform { excludeTags 'libtorch-native', 'petsctao-native', 'jax-native', 'opencv-native' }
}

def nativeBuildDirectory = layout.buildDirectory.dir('native')
def petscTaoBuildDirectory = layout.buildDirectory.dir('native-petsctao')
def jaxBuildDirectory = layout.buildDirectory.dir('native-jax')
def openCvBuildDirectory = layout.buildDirectory.dir('native-opencv')
def libTorchSourceDirectory = layout.projectDirectory.dir('src/main/cpp')
def petscTaoSourceDirectory = layout.projectDirectory.dir('src/main/cpp/petsctao')
def jaxSourceDirectory = layout.projectDirectory.dir('src/main/cpp/jax')
def openCvSourceDirectory = layout.projectDirectory.dir('src/main/cpp/opencv')

tasks.register('configureLibTorchNative', Exec) {
    inputs.dir(libTorchSourceDirectory)
    outputs.file(nativeBuildDirectory.map { it.file('build.ninja') })
    doFirst {
        String libTorchHome = System.getenv('LIBTORCH_HOME') ?: '/home/igor/.local/opt/libtorch-2.7.1-cpu'
        if (!libTorchHome || !new File(libTorchHome).exists()) throw new GradleException("LIBTORCH_HOME must point to an unpacked LibTorch distribution: ${libTorchHome}")
        String cmake = System.getenv('CMAKE_COMMAND') ?: 'cmake'
        commandLine cmake, '-S', libTorchSourceDirectory.asFile.absolutePath,
            '-B', nativeBuildDirectory.get().asFile.absolutePath, '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release', "-DCMAKE_PREFIX_PATH=${libTorchHome}",
            "-DTorch_DIR=${new File(libTorchHome, 'share/cmake/Torch').absolutePath}"
    }
}

tasks.register('buildLibTorchNative', Exec) {
    dependsOn tasks.named('configureLibTorchNative')
    inputs.dir(libTorchSourceDirectory)
    inputs.file(nativeBuildDirectory.map { it.file('build.ninja') })
    outputs.file(nativeBuildDirectory.map { it.file('libgroovy_math_libtorch.so') })
    doFirst {
        String cmake = System.getenv('CMAKE_COMMAND') ?: 'cmake'
        commandLine cmake, '--build', nativeBuildDirectory.get().asFile.absolutePath, '--parallel'
    }
}

tasks.register('nativeTest', Test) {
    dependsOn tasks.named('buildLibTorchNative')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'libtorch-native' }
    systemProperty 'groovy.math.libtorch.library',
        nativeBuildDirectory.get().file('libgroovy_math_libtorch.so').asFile.absolutePath
    environment 'MOQUI_MATH_ENTITIES', System.getenv('MOQUI_MATH_ENTITIES') ?: '../../moqui/tests/ai/moqui-framework/runtime/component/moqui-math/entity/MathEntities.xml'
}

