plugins {
    id 'groovy'
    id 'java-library'
    id 'jacoco'
    id 'maven-publish'
}

repositories {
    mavenCentral()
}

dependencies {
    api 'org.apache.groovy:groovy:5.0.8'
    implementation 'org.apache.groovy:groovy-json:5.0.8'
    implementation 'com.google.ortools:ortools-java:9.15.6755'

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['--enable-preview']
}

tasks.withType(GroovyCompile).configureEach {
    groovyOptions.forkOptions.jvmArgs += ['--enable-preview']
}

tasks.withType(Test).configureEach {
    jvmArgs += ['--enable-preview']
}

tasks.withType(JavaExec).configureEach {
    jvmArgs += ['--enable-preview']
}

tasks.named('test') {
    useJUnitPlatform()
    useJUnitPlatform { excludeTags 'libtorch-native', 'petsctao-native' }
}

def nativeBuildDirectory = layout.buildDirectory.dir('native')
def petscTaoBuildDirectory = layout.buildDirectory.dir('native-petsctao')
def libTorchSourceDirectory = layout.projectDirectory.dir('src/main/cpp')
def petscTaoSourceDirectory = layout.projectDirectory.dir('src/main/cpp/petsctao')

tasks.register('configureLibTorchNative', Exec) {
    inputs.dir(libTorchSourceDirectory)
    outputs.file(nativeBuildDirectory.map { it.file('build.ninja') })
    doFirst {
        String libTorchHome = System.getenv('LIBTORCH_HOME') ?: '/home/igor/.local/opt/libtorch-2.7.1-cpu'
        if (!libTorchHome || !new File(libTorchHome).exists()) throw new GradleException("LIBTORCH_HOME must point to an unpacked LibTorch distribution: ${libTorchHome}")
        String cmake = System.getenv('CMAKE_COMMAND') ?: 'cmake'
        commandLine cmake, '-S', libTorchSourceDirectory.asFile.absolutePath,
            '-B', nativeBuildDirectory.get().asFile.absolutePath, '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release', "-DCMAKE_PREFIX_PATH=${libTorchHome}",
            "-DTorch_DIR=${new File(libTorchHome, 'share/cmake/Torch').absolutePath}"
    }
}

tasks.register('buildLibTorchNative', Exec) {
    dependsOn tasks.named('configureLibTorchNative')
    inputs.dir(libTorchSourceDirectory)
    inputs.file(nativeBuildDirectory.map { it.file('build.ninja') })
    outputs.file(nativeBuildDirectory.map { it.file('libgroovy_math_libtorch.so') })
    doFirst {
        String cmake = System.getenv('CMAKE_COMMAND') ?: 'cmake'
        commandLine cmake, '--build', nativeBuildDirectory.get().asFile.absolutePath, '--parallel'
    }
}

tasks.register('nativeTest', Test) {
    dependsOn tasks.named('buildLibTorchNative')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform { includeTags 'libtorch-native' }
    systemProperty 'groovy.math.libtorch.library',
        nativeBuildDirectory.get().file('libgroovy_math_libtorch.so').asFile.absolutePath
    environment 'MOQUI_MATH_ENTITIES', System.getenv('MOQUI_MATH_ENTITIES') ?: '../../moqui/tests/ai/moqui-framework/runtime/component/moqui-math/entity/MathEntities.xml'
}

tasks.register('configurePetscTaoNative', Exec) {
    inputs.dir(petscTaoSourceDirectory)
    inputs.file('src/main/cpp/petsctao_jni.cpp')
    outputs.file(petscTaoBuildDirectory.map { it.file('build.ninja') })
    doFirst {
        String cmake = System.getenv('CMAKE_COMMAND') ?: 'cmake'
        commandLine cmake, '-S', petscTaoSourceDirectory.asFile.absolutePath,
            '-B', petscTaoBuildDirectory.get().asFile.absolutePath, '-G', 'Ninja',
            '-DCMAKE_BUILD_TYPE=Release'
    }
}

tasks.register('buildPetscTaoNative', Exec) {
    dependsOn tasks.named('configurePetscTaoNative')
    inputs.file('src/main/cpp/petsctao_jni.cpp')
    inputs.file(petscTaoBuildDirectory.map { it.file('build.ninja') })
    outputs.file(petscTaoBuildDirectory.map { it.file('libgroovy_math_petsctao.so') })
    doFirst {
        String cmake = System.getenv('CMAKE_COMMAND') ?: 'cmake'
        commandLine cmake, '--build', petscTaoBuildDirectory.get().asFile.absolutePath, '--parallel'
    }
}

tasks.register('petscTaoNativeTest', JavaExec) {
    dependsOn tasks.named('buildPetscTaoNative'), tasks.named('testClasses')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'groovy.ui.GroovyMain'
    args file('src/test/scripts/run-petsctao-native-check.groovy').absolutePath
    systemProperty 'groovy.math.petsctao.library',
        petscTaoBuildDirectory.get().file('libgroovy_math_petsctao.so').asFile.absolutePath
    environment 'MOQUI_MATH_ENTITIES', System.getenv('MOQUI_MATH_ENTITIES') ?: ''
}

tasks.register('benchmarkLibTorch', JavaExec) {
    dependsOn tasks.named('buildLibTorchNative'), tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.moqui.math.libtorch.LibTorchParallelBenchmark'
    systemProperty 'groovy.math.libtorch.library',
        nativeBuildDirectory.get().file('libgroovy_math_libtorch.so').asFile.absolutePath
    if (System.getProperty('groovy.math.benchmark.iterations')) {
        systemProperty 'groovy.math.benchmark.iterations', System.getProperty('groovy.math.benchmark.iterations')
    }
}

tasks.register('benchmarkLibTorchCompute', JavaExec) {
    dependsOn tasks.named('buildLibTorchNative'), tasks.named('testClasses')
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'org.moqui.math.libtorch.LibTorchComputeBenchmark'
    systemProperty 'groovy.math.libtorch.library',
        nativeBuildDirectory.get().file('libgroovy_math_libtorch.so').asFile.absolutePath
    ['width', 'batch', 'iterations'].each { String option ->
        String value = System.getProperty("groovy.math.benchmark.${option}")
        if (value) systemProperty "groovy.math.benchmark.${option}", value
    }
}

tasks.register('runOrToolsProductionPlan', JavaExec) {
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'groovy.ui.GroovyMain'
    args file('examples/run-ortools-production-plan.groovy').absolutePath
}

tasks.register('runPetscTaoEnergyDispatch', JavaExec) {
    dependsOn tasks.named('buildPetscTaoNative'), tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'groovy.ui.GroovyMain'
    args file('examples/run-petsctao-energy-dispatch.groovy').absolutePath
    systemProperty 'groovy.math.petsctao.library',
        petscTaoBuildDirectory.get().file('libgroovy_math_petsctao.so').asFile.absolutePath
}

tasks.named('check') {
    dependsOn tasks.named('jacocoTestReport')
}

publishing {
    publications {
        library(MavenPublication) {
            from components.java
        }
    }
}

tasks.register('generateModels', JavaExec) {
    dependsOn tasks.named('classes')
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'groovy.ui.GroovyMain'
    args file('scripts/GenerateModelClasses.groovy').absolutePath
    environment 'MOQUI_MATH_ENTITIES', System.getenv('MOQUI_MATH_ENTITIES') ?: '../../moqui/tests/ai/moqui-framework/runtime/component/moqui-math/entity/MathEntities.xml'
}
